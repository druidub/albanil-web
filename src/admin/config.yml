backend:
  name: github           # sigues usando el login GitHub+Auth0
  repo: druidub/albanil-web
  branch: dev            # las ediciones van a dev

media_folder: "src/assets/uploads"     # adonde va la imagen
public_folder: "/assets/uploads"       # cómo la web la referenciará

collections:

  # 1 ──────────────── Lista de etiquetas ────────────────
  - name: etiquetas
    label: Etiquetas
    delete: false
    editor:
      preview: false                 # no hace falta preview
    files:
      - file: "src/data/etiquetas.json"
        label: Lista de etiquetas
        name: etiquetas
        fields:
          - label: Etiquetas
            name: etiquetas
            widget: list
            summary: "{{fields.etiquetas}}"   # muestra la lista en el resumen

  # 2 ──────────────── Obras realizadas ──────────────────
  - name: obras
    label: Obras
    label_singular: Obra
    folder: "src/data/obras"
    create: true
    slug: "{{slug}}"                  # archivo = titulo-sin-espacios.md
    summary: "{{title}} — {{tags}}"   # cómo aparece en el listado del CMS
    fields:
      - { name: title,  label: Título }
      - { name: image,  label: Foto,  widget: image }
      - { name: date,   label: Fecha, widget: datetime, format: "YYYY-MM-DD" }
      - label: Etiquetas
        name: tags
        widget: relation              # toma opciones de la lista maestra
        collection: etiquetas
        value_field: "etiquetas.*"
        search_fields: ["etiquetas.*"]
        display_fields: ["etiquetas.*"]
        multiple: true
      - { name: body,   label: Descripción, widget: markdown, required: false }
